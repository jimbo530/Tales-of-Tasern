<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MfT &mdash; meme for trees</title>
    <meta name="description" content="Impact games and deflationary tokens on Base. Play games, burn tokens, plant trees.">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --green:#3fb950;--green-glow:rgba(63,185,80,.25);
            --card:rgba(21,26,33,.82);--border:rgba(55,65,81,.5);
            --text:#c9d1d9;--dim:#8b949e;--bright:#e6edf3;
            --accent:#58a6ff;
        }
        body{
            margin:0;color:var(--text);
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
            line-height:1.6;min-height:100vh;background:#0b0e11;
            display:flex;align-items:center;justify-content:center;
        }
        body::before{
            content:'';position:fixed;inset:0;z-index:-2;
            background:url('/mft/bg.jpg') center/cover no-repeat;
        }
        body::after{
            content:'';position:fixed;inset:0;z-index:-1;
            background:linear-gradient(180deg,rgba(5,10,5,.65) 0%,rgba(8,14,8,.82) 50%,rgba(5,10,5,.92) 100%);
        }
        .wrap{max-width:700px;width:100%;margin:0 auto;padding:3rem 1.5rem;position:relative;z-index:1;text-align:center}

        .logo{font-size:4rem;font-weight:800;color:#fff;letter-spacing:.08em;margin-bottom:.25rem;
            text-shadow:0 0 40px var(--green-glow),0 2px 8px rgba(0,0,0,.6)}
        .logo span{color:var(--green)}
        .tagline{font-size:1rem;color:var(--green);font-weight:500;margin-bottom:3.5rem;
            text-shadow:0 1px 6px rgba(0,0,0,.5)}

        .grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2.5rem}

        .card{
            background:var(--card);border:1px solid var(--border);border-radius:16px;
            backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
            padding:2.5rem 1.5rem;text-decoration:none;color:var(--text);
            transition:border-color .2s,transform .15s,box-shadow .2s;
            display:block;
        }
        .card:hover{
            border-color:var(--green);transform:translateY(-3px);
            box-shadow:0 8px 28px rgba(0,0,0,.35),0 0 24px var(--green-glow);
        }
        .card-icon{font-size:3rem;margin-bottom:.75rem}
        .card-name{font-size:1.5rem;font-weight:700;color:var(--bright);margin-bottom:.4rem}
        .card-desc{font-size:.88rem;color:var(--dim);line-height:1.5}

        footer{color:var(--dim);font-size:.78rem}
        footer a{color:var(--green);text-decoration:none}
        footer a:hover{text-decoration:underline}

        @media(max-width:550px){
            .grid{grid-template-columns:1fr}
            .logo{font-size:2.8rem}
            .wrap{padding:2rem 1rem}
            .tagline{margin-bottom:2.5rem}
        }
    </style>
</head>
<body>
<div class="wrap">

    <div class="logo"><span>M</span>f<span>T</span></div>
    <div class="tagline">meme for trees</div>

    <div class="grid">
        <a href="/baseling/" class="card">
            <div class="card-icon">&#x1F3AE;</div>
            <div class="card-name">Arcade</div>
            <div class="card-desc">Play games, earn yield, burn tokens.</div>
        </a>
        <a href="/tokens/" class="card">
            <div class="card-icon">&#x1FA99;</div>
            <div class="card-name">Token Index</div>
            <div class="card-desc">29 tokens across Base and Polygon.</div>
        </a>
    </div>

    <footer>
        Base (8453) &middot; <a href="https://basescan.org/address/0xfd780B0aE569e15e514B819ecFDF46f804953a4B" target="_blank" rel="noopener">burn address</a> &middot; you profit, trees grow, people eat
    </footer>

</div>
</body>
</html>
