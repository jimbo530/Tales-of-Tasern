<h1>Baseling Items + Equipment Deployer</h1>
<p style="font-size:11px;color:#888">Deploy two contracts: BaselingItems (ERC1155 items) + BaselingEquipment (item locker)</p>

<button onclick="connect()">CONNECT WALLET</button>
<span id="wallet" class="addr"></span>

<div class="section">
<h2>1. Deploy BaselingItems (ERC1155)</h2>
<label>WETH Address:</label>
<input id="weth" value="0x4200000000000000000000000000000000000006">
<label>PowerPlant Address:</label>
<input id="pp" value="0x493D3164F6d6187467B1FD3955bd1030763a7Fec">

<div>Deployed: <span id="itemsAddr" class="addr">—</span></div>
</div>

<div class="section">
<h2>2. Deploy BaselingEquipment (Locker)</h2>
<label>BaselingNFT Address:</label>

<div class="section">
<h2>3. Configure</h2>
<button onclick="allowItems()">ALLOW ITEMS IN EQUIPMENT</button>

</div>

</div>

function log(msg) {
  var el = document.getElementById('log');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

async function connect() {
  if (!window.ethereum) { log('No wallet found'); return; }
  provider = new ethers.BrowserProvider(window.ethereum);
  await provider.send('eth_requestAccounts', []);
  signer = await provider.getSigner();
  var addr = await signer.getAddress();
  document.getElementById('wallet').textContent = addr;
  log('Connected: ' + addr);

  // Restore saved addresses
  if (ITEMS_ADDR) {
    document.getElementById('itemsAddr').textContent = ITEMS_ADDR;
    itemsContract = new ethers.Contract(ITEMS_ADDR, ITEMS_ABI, signer);
  }
  if (EQUIP_ADDR) {
    document.getElementById('equipAddr').textContent = EQUIP_ADDR;
    equipContract = new ethers.Contract(EQUIP_ADDR, EQUIP_ABI, signer);
  }
}

async function deployItems() {
  if (!signer) { log('Connect wallet first'); return; }
  var weth = document.getElementById('weth').value;
  var pp = document.getElementById('pp').value;
  var uri = document.getElementById('itemsURI').value;
  log('Deploying BaselingItems...');
  var factory = new ethers.ContractFactory(ITEMS_ABI, '0x' + ITEMS_BIN, signer);
  var contract = await factory.deploy(weth, pp, uri);
  log('TX sent: ' + contract.deploymentTransaction().hash);
  await contract.waitForDeployment();
  ITEMS_ADDR = await contract.getAddress();
  localStorage.setItem('bslng_items_addr', ITEMS_ADDR);
  document.getElementById('itemsAddr').textContent = ITEMS_ADDR;
  itemsContract = new ethers.Contract(ITEMS_ADDR, ITEMS_ABI, signer);
  log('BaselingItems deployed: ' + ITEMS_ADDR);
}

async function deployEquip() {
  if (!signer) { log('Connect wallet first'); return; }
  var nft = document.getElementById('nft').value;
  log('Deploying BaselingEquipment...');
  var factory = new ethers.ContractFactory(EQUIP_ABI, '0x' + EQUIP_BIN, signer);
  var contract = await factory.deploy(nft);
  log('TX sent: ' + contract.deploymentTransaction().hash);
  await contract.waitForDeployment();
  EQUIP_ADDR = await contract.getAddress();
  localStorage.setItem('bslng_equip_addr', EQUIP_ADDR);
  document.getElementById('equipAddr').textContent = EQUIP_ADDR;
  equipContract = new ethers.Contract(EQUIP_ADDR, EQUIP_ABI, signer);
  log('BaselingEquipment deployed: ' + EQUIP_ADDR);
}

async function allowItems() {
  if (!equipContract || !ITEMS_ADDR) { log('Deploy both contracts first'); return; }
  log('Allowing items contract in equipment locker...');
  var tx = await equipContract.setAllowedItems(ITEMS_ADDR, true);
  await tx.wait();
  log('Items contract allowed!');
}

async function createHats() {
  if (!itemsContract) { log('Deploy items contract first'); return; }
  var hats = [
    { name: 'Santa Hat',     slot: 0, rarity: 2, price: '0.001', max: 0 },
    { name: 'Top Hat',       slot: 0, rarity: 3, price: '0.005', max: 100 },
    { name: 'Baseball Cap',  slot: 0, rarity: 0, price: '0.0005', max: 0 },
    { name: 'Cowboy Hat',    slot: 0, rarity: 2, price: '0.002', max: 0 },
  ];
  for (var i = 0; i < hats.length; i++) {
    var h = hats[i];
    log('Creating ' + h.name + '...');
    var tx = await itemsContract.createItem(h.name, h.slot, h.rarity, ethers.parseEther(h.price), h.max);
    var r = await tx.wait();
    log(h.name + ' created (ID ' + (i+1) + ')');
  }
  log('All 4 hats created!');
}

async function createItem() {
  if (!itemsContract) { log('Deploy items contract first'); return; }
  var name = document.getElementById('iName').value;
  var slot = parseInt(document.getElementById('iSlot').value);
  var rarity = parseInt(document.getElementById('iRarity').value);
  var price = document.getElementById('iPrice').value;
  var maxSupply = parseInt(document.getElementById('iMaxSupply').value);
  log('Creating ' + name + '...');
  var tx = await itemsContract.createItem(name, slot, rarity, ethers.parseEther(price), maxSupply);
  var r = await tx.wait();
  var nextId = await itemsContract.nextItemId();
  log(name + ' created (ID ' + (Number(nextId) - 1) + ')');
}
