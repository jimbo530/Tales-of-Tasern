server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tasern.quest www.tasern.quest;

    ssl_certificate /etc/letsencrypt/live/tasern.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tasern.quest/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/tasern;
    index index.html;

    # Arcade menu + static games (baseling, ooze-battle)
    location / {
        try_files $uri $uri/ =404;
    }

    # Baseling metadata API (OpenSea tokenURI)
    location /api/baseling/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tales of Tasern D20 RPG (Next.js, basePath=/tot)
    location /tot/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /tot {
        return 301 /tot/;
    }

    # NFT Card Game (Next.js, basePath=/cards)
    location /cards/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /cards {
        return 301 /cards/;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name tasern.quest www.tasern.quest;
    return 301 https://$host$request_uri;
}
