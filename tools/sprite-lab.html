<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baseling Sprite Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a1a; color: #ccc; font-family: 'Press Start 2P', monospace; font-size: 10px; }
h1 { text-align: center; color: #f0d060; font-size: 14px; padding: 20px 0 6px; }
.subtitle { text-align: center; color: #666; font-size: 7px; margin-bottom: 16px; }

/* Controls bar */
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 10px 20px; background: rgba(20,20,40,0.9); border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10; }
.controls label { color: #888; font-size: 7px; }
.controls select, .controls input { font-family: 'Press Start 2P', monospace; font-size: 7px; background: #1a1a2e; color: #f0d060; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; }
.controls button { font-family: 'Press Start 2P', monospace; font-size: 7px; background: #1a2e1a; color: #4ade80; border: 1px solid #4ade80; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
.controls button:hover { background: #2e4e2e; }
.controls button.active { background: #4ade80; color: #000; }

/* Grid */
.grid { display: flex; flex-wrap: wrap; gap: 16px; padding: 20px; justify-content: center; }
.card { background: rgba(20,20,40,0.8); border: 2px solid #333; border-radius: 8px; padding: 10px; text-align: center; min-width: 140px; }
.card canvas { image-rendering: pixelated; display: block; margin: 0 auto 6px; border-radius: 4px; }
.card .name { color: #f0d060; font-size: 7px; margin-bottom: 4px; }
.card .info { color: #888; font-size: 5px; line-height: 1.6; }
.rarity-common { color: #aaa; }
.rarity-uncommon { color: #4ade80; }
.rarity-rare { color: #60a5fa; }
.rarity-legendary { color: #f0d060; }
.rarity-epic { color: #a855f7; }

/* Tint matrix */
.tint-row { display: flex; gap: 4px; align-items: center; margin-bottom: 8px; justify-content: center; }
.tint-row .label { width: 90px; text-align: right; padding-right: 8px; font-size: 7px; }
.tint-cell { text-align: center; }
.tint-cell canvas { image-rendering: pixelated; display: block; margin: 0 auto; border-radius: 4px; }
.tint-cell .egg-label { font-size: 5px; margin-top: 2px; }

/* Slider */
.slider-group { display: flex; align-items: center; gap: 6px; }
.slider-group input[type=range] { width: 80px; }
.slider-val { color: #f0d060; min-width: 30px; }
</style>
</head>
<body>

<h1>BASELING SPRITE LAB</h1>
<p class="subtitle">11 BASE SPECIES &times; 5 EGG COLORS &mdash; TINT PREVIEW</p>

<div class="controls">
  <div>
    <label>TINT STRENGTH</label><br>
    <div class="slider-group">
      <input type="range" id="tintStrength" min="0" max="50" value="12" oninput="updateSlider();renderAll()">
      <span class="slider-val" id="tintVal">12%</span>
    </div>
  </div>
  <div>
    <label>SIZE</label><br>
    <select id="spriteSize" onchange="renderAll()">
      <option value="64">64px</option>
      <option value="96" selected>96px</option>
      <option value="128">128px</option>
      <option value="192">192px</option>
    </select>
  </div>
  <div>
    <label>BACKGROUND</label><br>
    <select id="bgColor" onchange="renderAll()">
      <option value="#0a0a1a">Dark</option>
      <option value="#1a1a2e">Navy</option>
      <option value="#ffffff">White</option>
      <option value="none">None</option>
    </select>
  </div>
  <div>
    <label>GIANT (2x)</label><br>
    <button id="btn-giant" onclick="toggleGiant()">OFF</button>
  </div>
  <div>
    <label>SPARKLE</label><br>
    <button id="btn-sparkle" onclick="toggleSparkle()">OFF</button>
  </div>
  <div>
    <label>VIEW</label><br>
    <button id="btn-grid" class="active" onclick="setView('grid')">GRID</button>
    <button id="btn-matrix" onclick="setView('matrix')">MATRIX</button>
  </div>
</div>

<div id="grid-view" class="grid"></div>
<div id="matrix-view" style="display:none;padding:20px;overflow-x:auto"></div>

<script>
var SPRITES = [
  {id:'floof-cat', name:'Floof Cat', rarity:'common', src:'sprites/wimmple-baby.webp', gate:null},
  {id:'bunny',     name:'Puppy',     rarity:'common', src:'sprites/baby-bunny-white.png', gate:null},
  {id:'cat',       name:'Cat',       rarity:'common', src:'sprites/baby-cat-white.png', gate:null},
  {id:'frog',      name:'Frog',      rarity:'uncommon', src:'sprites/baby-frog-green.png', gate:null},
  {id:'groundhog', name:'Groundhog', rarity:'rare', src:'sprites/baby-groundhog.png', gate:null},
  {id:'mouse',     name:'Mouse',     rarity:'rare', src:'sprites/baby-mouse.png', gate:null},
  {id:'beaver',    name:'Beaver',    rarity:'rare', src:'sprites/baby-beaver.png', gate:null},
  {id:'oak',       name:'Oak Tree',  rarity:'rare', src:'sprites/baby-oak.png', gate:'TGN'},
  {id:'bear-brown',name:'Brown Bear',rarity:'rare', src:'sprites/baby-bear-brown.png', gate:'BURGERS'},
  {id:'bull',      name:'Bull',      rarity:'rare', src:'sprites/baby-bull.png', gate:'AZUSD'},
  {id:'redpanda',  name:'Red Panda', rarity:'legendary', src:'sprites/baby-redpanda.png', gate:null},
  {id:'monkey',       name:'Monkey',       rarity:'rare', src:'sprites/baby-monkey.png', gate:null},
];

var EGG_COLORS = [
  {id:'none',  label:'BASE',  rgb:null,          color:'#888'},
  {id:'white', label:'WHITE', rgb:[200,210,255], color:'#93c5fd'},
  {id:'green', label:'GREEN', rgb:[74,222,128],  color:'#4ade80'},
  {id:'brown', label:'BROWN', rgb:[180,120,60],  color:'#f97316'},
  {id:'red',   label:'RED',   rgb:[239,68,68],   color:'#ef4444'},
  {id:'blue',  label:'BLUE',  rgb:[96,165,250],  color:'#60a5fa'},
  {id:'gold',  label:'GOLD',  rgb:[255,215,0],   color:'#ffd700'},
];

var EGG_COLOR_AFFINITY = {
  'floof-cat':['white'], 'bunny':['white'], 'cat':['white','blue'],
  'mouse':['brown','white'], 'groundhog':['brown'], 'beaver':['brown'],
  'redpanda':['red','brown'], 'frog':['green'], 'oak':['green','brown'],
  'bear-brown':['brown'], 'bull':['white','brown'],
  'monkey':['brown','red'],
};

var loadedImages = {};
var giantMode = false;
var sparkleMode = false;
var sparkleCanvases = []; // animated canvases for sparkle effect
var sparkleParticles = {}; // per-canvas particle arrays

// --- BG REMOVAL (auto-detects BG color from corners) ---
function processSprite(img) {
  var tc = document.createElement('canvas'); tc.width = img.width; tc.height = img.height;
  var ts = tc.getContext('2d'); ts.drawImage(img, 0, 0);
  var id = ts.getImageData(0, 0, tc.width, tc.height), d = id.data;
  var w = tc.width, h = tc.height;
  // Auto-detect BG color from corner pixels
  var corners=[[0,0],[w-1,0],[0,h-1],[w-1,h-1],[1,0],[w-2,0],[0,1],[w-1,1]];
  var bgR=0,bgG=0,bgB=0,cs=0;
  for(var ci=0;ci<corners.length;ci++){
    var pi2=(corners[ci][1]*w+corners[ci][0])*4;
    if(d[pi2+3]>128){bgR+=d[pi2];bgG+=d[pi2+1];bgB+=d[pi2+2];cs++;}
  }
  if(cs>0){bgR=bgR/cs;bgG=bgG/cs;bgB=bgB/cs;}
  var colorDist=55;
  function isBgColor(idx){
    var dr=d[idx]-bgR,dg=d[idx+1]-bgG,db=d[idx+2]-bgB;
    return Math.sqrt(dr*dr+dg*dg+db*db)<colorDist;
  }
  var bg = new Uint8Array(w * h), queue = [];
  for (var x = 0; x < w; x++) {
    if (isBgColor(x*4)) { bg[x] = 1; queue.push(x); }
    var bi = (h-1)*w + x;
    if (isBgColor(bi*4)) { bg[bi] = 1; queue.push(bi); }
  }
  for (var y = 1; y < h-1; y++) {
    var li = y*w;
    if (isBgColor(li*4)) { bg[li] = 1; queue.push(li); }
    var ri = y*w + w - 1;
    if (isBgColor(ri*4)) { bg[ri] = 1; queue.push(ri); }
  }
  var qi = 0;
  while (qi < queue.length) {
    var pi = queue[qi++], px = pi % w, py = (pi - px) / w;
    var nb = [[px-1,py],[px+1,py],[px,py-1],[px,py+1]];
    for (var n = 0; n < 4; n++) {
      var nx = nb[n][0], ny = nb[n][1];
      if (nx < 0 || nx >= w || ny < 0 || ny >= h) continue;
      var ni = ny * w + nx;
      if (!bg[ni] && isBgColor(ni*4)) { bg[ni] = 1; queue.push(ni); }
    }
  }
  for (var i = 0; i < w*h; i++) {
    if (bg[i]) { d[i*4+3] = 0; continue; }
    var ix2 = i % w, iy2 = (i - ix2) / w, nearBg = false;
    if (ix2 > 0 && bg[i-1]) nearBg = true;
    if (ix2 < w-1 && bg[i+1]) nearBg = true;
    if (iy2 > 0 && bg[i-w]) nearBg = true;
    if (iy2 < h-1 && bg[i+w]) nearBg = true;
    if (nearBg) {
      var dr2=d[i*4]-bgR,dg2=d[i*4+1]-bgG,db2=d[i*4+2]-bgB;
      var dist2=Math.sqrt(dr2*dr2+dg2*dg2+db2*db2);
      if(dist2<colorDist*1.5) d[i*4+3]=Math.round(Math.min(1,dist2/colorDist)*d[i*4+3]);
    }
  }
  ts.putImageData(id, 0, 0);
  // Center in square
  id = ts.getImageData(0, 0, w, h); d = id.data;
  var minX = w, minY = h, maxX = 0, maxY = 0;
  for (var y2 = 0; y2 < h; y2++) for (var x2 = 0; x2 < w; x2++) {
    if (d[(y2*w+x2)*4+3] > 10) { if (x2<minX)minX=x2; if(x2>maxX)maxX=x2; if(y2<minY)minY=y2; if(y2>maxY)maxY=y2; }
  }
  var sz = 256, c = document.createElement('canvas'); c.width = sz; c.height = sz;
  var s = c.getContext('2d'); s.imageSmoothingEnabled = false;
  var cw = maxX-minX+1, ch2 = maxY-minY+1, pad = 16, avail = sz-pad*2;
  var sc = Math.min(avail/cw, avail/ch2); if (sc > 1.3) sc = 1.3;
  var dw2 = Math.round(cw*sc), dh2 = Math.round(ch2*sc);
  s.drawImage(tc, minX, minY, cw, ch2, Math.round((sz-dw2)/2), Math.round((sz-dh2)/2), dw2, dh2);
  return c;
}

// --- TINTING (pixel-level, preserves eyes/dark features) ---
function drawTinted(base, tintRGB, strength, size, bgCol) {
  var c = document.createElement('canvas'); c.width = size; c.height = size;
  var ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
  if (bgCol && bgCol !== 'none') { ctx.fillStyle = bgCol; ctx.fillRect(0, 0, size, size); }
  // Draw sprite at target size
  ctx.drawImage(base, 0, 0, size, size);
  // Pixel-level tint: skip dark pixels (eyes, outlines)
  if (tintRGB && strength > 0) {
    var id = ctx.getImageData(0, 0, size, size), d = id.data;
    var tr = tintRGB[0], tg = tintRGB[1], tb = tintRGB[2], s = strength / 100;
    for (var i = 0; i < d.length; i += 4) {
      if (d[i+3] < 10) continue; // transparent
      var bright = Math.max(d[i], d[i+1], d[i+2]);
      if (bright < 60) continue; // eyes, outlines, dark features stay untouched
      var f = s * (bright / 255); // lighter pixels get more tint
      d[i]   = Math.round(d[i]   * (1-f) + tr * f);
      d[i+1] = Math.round(d[i+1] * (1-f) + tg * f);
      d[i+2] = Math.round(d[i+2] * (1-f) + tb * f);
    }
    ctx.putImageData(id, 0, 0);
  }
  return c;
}

// --- SETTINGS ---
function getS() {
  var sz = parseInt(document.getElementById('spriteSize').value);
  if (giantMode) sz *= 2;
  return { strength: parseInt(document.getElementById('tintStrength').value), size: sz, bg: document.getElementById('bgColor').value };
}
function updateSlider() { document.getElementById('tintVal').textContent = document.getElementById('tintStrength').value + '%'; }
function toggleGiant() {
  giantMode = !giantMode;
  document.getElementById('btn-giant').textContent = giantMode ? 'ON' : 'OFF';
  document.getElementById('btn-giant').className = giantMode ? 'active' : '';
  renderAll();
}
function toggleSparkle() {
  sparkleMode = !sparkleMode;
  document.getElementById('btn-sparkle').textContent = sparkleMode ? 'ON' : 'OFF';
  document.getElementById('btn-sparkle').className = sparkleMode ? 'active' : '';
  renderAll();
  if (sparkleMode) requestAnimationFrame(animateSparkles);
}

// --- SPARKLE ANIMATION ---
function initSparkles(canvas, baseImg, tintRGB, strength, bgCol) {
  var id = canvas._sparkleId = Math.random();
  var sz = canvas.width;
  // Store render info for redraw
  canvas._sparkleBase = baseImg;
  canvas._sparkleTint = tintRGB;
  canvas._sparkleStr = strength;
  canvas._sparkleBg = bgCol;
  // Generate sparkle particles
  var parts = [];
  for (var i = 0; i < 8; i++) {
    parts.push({
      x: 0.2 + Math.random() * 0.6,
      y: 0.15 + Math.random() * 0.65,
      phase: Math.random() * Math.PI * 2,
      speed: 1.5 + Math.random() * 2,
      size: 2 + Math.random() * 3,
      bright: 0.5 + Math.random() * 0.5,
    });
  }
  sparkleParticles[id] = parts;
  sparkleCanvases.push(canvas);
}

function animateSparkles() {
  if (!sparkleMode) { sparkleCanvases = []; sparkleParticles = {}; return; }
  var t = performance.now() / 1000;
  for (var i = sparkleCanvases.length - 1; i >= 0; i--) {
    var cv = sparkleCanvases[i];
    if (!cv.isConnected) { sparkleCanvases.splice(i, 1); delete sparkleParticles[cv._sparkleId]; continue; }
    var ctx = cv.getContext('2d');
    var sz = cv.width;
    // Redraw base tinted sprite
    ctx.clearRect(0, 0, sz, sz);
    if (cv._sparkleBg && cv._sparkleBg !== 'none') { ctx.fillStyle = cv._sparkleBg; ctx.fillRect(0, 0, sz, sz); }
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(cv._sparkleBase, 0, 0, sz, sz);
    if (cv._sparkleTint && cv._sparkleStr > 0) {
      var id = ctx.getImageData(0, 0, sz, sz), d = id.data;
      var tr = cv._sparkleTint[0], tg = cv._sparkleTint[1], tb = cv._sparkleTint[2], s = cv._sparkleStr / 100;
      for (var p = 0; p < d.length; p += 4) {
        if (d[p+3] < 10) continue;
        var bright = Math.max(d[p], d[p+1], d[p+2]);
        if (bright < 60) continue;
        var f = s * (bright / 255);
        d[p]   = Math.round(d[p]   * (1-f) + tr * f);
        d[p+1] = Math.round(d[p+1] * (1-f) + tg * f);
        d[p+2] = Math.round(d[p+2] * (1-f) + tb * f);
      }
      ctx.putImageData(id, 0, 0);
    }
    // Draw sparkles
    var parts = sparkleParticles[cv._sparkleId] || [];
    for (var j = 0; j < parts.length; j++) {
      var sp = parts[j];
      var glow = (Math.sin(t * sp.speed + sp.phase) + 1) / 2; // 0-1 pulse
      if (glow < 0.3) continue; // hidden when dim
      var alpha = glow * sp.bright;
      var px = sp.x * sz, py = sp.y * sz;
      var r = sp.size * (0.5 + glow * 0.5);
      // Cross sparkle
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#fffde0';
      ctx.fillRect(px - 0.5, py - r, 1, r * 2);
      ctx.fillRect(px - r, py - 0.5, r * 2, 1);
      // Center glow
      ctx.fillStyle = '#fff';
      ctx.fillRect(px - 0.5, py - 0.5, 1, 1);
    }
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(animateSparkles);
}

// --- GRID VIEW ---
function renderGrid() {
  var el = document.getElementById('grid-view'); el.innerHTML = '';
  var s = getS();
  SPRITES.forEach(function(sp) {
    var base = loadedImages[sp.id]; if (!base) return;
    var affs = EGG_COLOR_AFFINITY[sp.id] || [];
    var card = document.createElement('div'); card.className = 'card';
    var h = '<div class="name">' + sp.name + '</div>';
    h += '<div class="rarity-' + sp.rarity + '" style="font-size:6px;margin-bottom:4px">' + sp.rarity.toUpperCase() + '</div>';
    if (sp.gate) h += '<div class="info" style="color:#f0d060">GATE: ' + sp.gate + '</div>';
    if (affs.length) h += '<div class="info">EGG BOOST: ' + affs.join(', ') + '</div>';
    card.innerHTML = h;
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:4px;justify-content:center;margin-top:6px;flex-wrap:wrap';
    EGG_COLORS.forEach(function(ec) {
      var cell = document.createElement('div'); cell.style.textAlign = 'center';
      var tRGB = ec.rgb, tStr = ec.rgb ? s.strength : 0;
      var cv = drawTinted(base, tRGB, tStr, s.size, s.bg);
      cv.style.width = s.size + 'px'; cv.style.height = s.size + 'px';
      var boosted = affs.indexOf(ec.id) >= 0;
      cv.style.border = boosted ? '2px solid ' + ec.color : '1px solid #222';
      if (boosted) cv.style.boxShadow = '0 0 6px ' + ec.color;
      cv.style.borderRadius = '4px';
      if (sparkleMode && ec.id === 'gold') initSparkles(cv, base, tRGB, tStr, s.bg);
      cell.appendChild(cv);
      var lbl = document.createElement('div');
      lbl.style.cssText = 'font-size:5px;margin-top:2px;color:' + ec.color;
      lbl.textContent = ec.label;
      cell.appendChild(lbl);
      row.appendChild(cell);
    });
    card.appendChild(row);
    el.appendChild(card);
  });
}

// --- MATRIX VIEW ---
function renderMatrix() {
  var el = document.getElementById('matrix-view'); el.innerHTML = '';
  var s = getS();
  // Header
  var hdr = document.createElement('div'); hdr.className = 'tint-row';
  hdr.innerHTML = '<div class="label" style="font-size:6px;color:#f0d060">SPECIES</div>';
  EGG_COLORS.forEach(function(ec) {
    hdr.innerHTML += '<div class="tint-cell" style="width:' + (s.size+8) + 'px"><div style="font-size:6px;color:' + ec.color + '">' + ec.label + '</div></div>';
  });
  el.appendChild(hdr);
  // Rows
  SPRITES.forEach(function(sp) {
    var base = loadedImages[sp.id]; if (!base) return;
    var affs = EGG_COLOR_AFFINITY[sp.id] || [];
    var row = document.createElement('div'); row.className = 'tint-row';
    var lbl = document.createElement('div'); lbl.className = 'label rarity-' + sp.rarity;
    lbl.style.fontSize = '6px'; lbl.textContent = sp.name;
    row.appendChild(lbl);
    EGG_COLORS.forEach(function(ec) {
      var cell = document.createElement('div'); cell.className = 'tint-cell';
      cell.style.width = (s.size + 8) + 'px';
      var tRGB = ec.rgb, tStr = ec.rgb ? s.strength : 0;
      var cv = drawTinted(base, tRGB, tStr, s.size, s.bg);
      cv.style.width = s.size + 'px'; cv.style.height = s.size + 'px';
      var boosted = affs.indexOf(ec.id) >= 0;
      cv.style.border = boosted ? '2px solid ' + ec.color : '1px solid #222';
      if (boosted) cv.style.boxShadow = '0 0 6px ' + ec.color;
      cv.style.borderRadius = '4px';
      if (sparkleMode && ec.id === 'gold') initSparkles(cv, base, tRGB, tStr, s.bg);
      cell.appendChild(cv);
      row.appendChild(cell);
    });
    el.appendChild(row);
  });
}

var currentView = 'grid';
function setView(v) {
  currentView = v;
  document.getElementById('grid-view').style.display = v === 'grid' ? 'flex' : 'none';
  document.getElementById('matrix-view').style.display = v === 'matrix' ? 'block' : 'none';
  document.getElementById('btn-grid').className = v === 'grid' ? 'active' : '';
  document.getElementById('btn-matrix').className = v === 'matrix' ? 'active' : '';
  renderAll();
}
function renderAll() {
  sparkleCanvases = []; sparkleParticles = {};
  if (currentView === 'grid') renderGrid(); else renderMatrix();
  if (sparkleMode) requestAnimationFrame(animateSparkles);
}

// --- LOAD ---
var loaded = 0;
SPRITES.forEach(function(sp) {
  var img = new Image();
  img.onload = function() { loadedImages[sp.id] = processSprite(img); loaded++; if (loaded >= SPRITES.length) renderAll(); };
  img.onerror = function() { loaded++; if (loaded >= SPRITES.length) renderAll(); };
  img.src = sp.src;
});
</script>
</body></html>
