  { id: 'deploy-community', label: 'Deploy CommunityGarden', color: '#c9a84c', type: 'deploy' },
  { id: 'deploy-router', label: 'Deploy BaselingRouter', color: '#c9a84c', type: 'deploy' },
  { id: 'cfg-poop-minter', label: 'PoopToken.setMinter(baselingNFT)', color: '#4ade80', type: 'config' },
  { id: 'cfg-nft-powerplant', label: 'BaselingNFT.setPowerPlant', color: '#4ade80', type: 'config' },
  { id: 'cfg-nft-auth-router', label: 'BaselingNFT.setAuthorized(router)', color: '#4ade80', type: 'config' },
  { id: 'cfg-nft-auth-pantry', label: 'BaselingNFT.setAuthorized(pantry)', color: '#4ade80', type: 'config' },
  { id: 'cfg-pantry-powerplant', label: 'PlayerPantry.setPowerPlant', color: '#4ade80', type: 'config' },
  { id: 'cfg-pantry-auth-router', label: 'PlayerPantry.setAuthorized(router)', color: '#4ade80', type: 'config' },
  { id: 'cfg-pp-auth-nft', label: 'PowerPlant.setAuthorized(baselingNFT)', color: '#4ade80', type: 'config' },
  { id: 'cfg-pp-auth-pantry', label: 'PowerPlant.setAuthorized(pantry)', color: '#4ade80', type: 'config' },
  { id: 'cfg-lp-pairs', label: 'Configure LP Pairs', color: '#a78bfa', type: 'config' },
];

// ===== BUILD UI =====
function buildUI() {
  // Progress bar
  const progBar = document.getElementById('progressBar');
  for (let i = 0; i < TOTAL_STEPS; i++) {
    const seg = document.createElement('div');
    seg.style.cssText = 'flex:1;height:6px;background:#333;border-radius:3px;';
    seg.innerHTML = `<div id="progFill${i}" style="width:0;height:100%;background:${steps[i].color};border-radius:3px;transition:width 0.3s;"></div>`;
    progBar.appendChild(seg);
  }
  // Steps
  const container = document.getElementById('stepsContainer');
  steps.forEach((step, i) => {
    const div = document.createElement('div');
    div.id = `section-${step.id}`;
    div.style.cssText = `margin-bottom:12px;padding:14px 18px;background:#1a1418;border:1px solid ${step.color}44;border-radius:8px;opacity:${i===0?'1':'0.4'};transition:opacity 0.3s;`;
    div.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="check-${step.id}" style="font-size:20px;color:#555;min-width:24px;">&#9675;</span>
        <div style="flex:1;">
          <h4 style="color:${step.color};margin:0;font-size:14px;">Step ${i+1}: ${step.label}</h4>
          <p id="status-${step.id}" style="color:#888;font-size:12px;margin:4px 0 0 0;"></p>
        </div>
        <button id="btn-${step.id}" onclick="runStep(${i})" disabled style="background:${step.color};color:#0a0608;border:none;padding:8px 18px;font-size:12px;font-weight:bold;border-radius:6px;cursor:pointer;font-family:Georgia;opacity:0.5;white-space:nowrap;">Run</button>
      </div>
      <p id="addr-${step.id}" style="color:#f0d070;font-family:monospace;font-size:12px;margin:6px 0 0 34px;word-break:break-all;display:none;"></p>
    `;
    container.appendChild(div);
  });
}
buildUI();

function enableStep(i) {
  if (i >= TOTAL_STEPS) return;
  const step = steps[i];
  document.getElementById(`section-${step.id}`).style.opacity = '1';
  const btn = document.getElementById(`btn-${step.id}`);
  btn.disabled = false;
  btn.style.opacity = '1';
}

function completeStep(i, addr) {
  const step = steps[i];
  document.getElementById(`check-${step.id}`).innerHTML = '&#10003;';
  document.getElementById(`check-${step.id}`).style.color = '#4ade80';
  document.getElementById(`progFill${i}`).style.width = '100%';
  const btn = document.getElementById(`btn-${step.id}`);
  btn.disabled = true;
  btn.style.opacity = '0.3';
  btn.textContent = 'Done';
  if (addr) {
    const addrEl = document.getElementById(`addr-${step.id}`);
    addrEl.textContent = addr;
    addrEl.style.display = 'block';
  }
  currentStep = i + 1;
  if (currentStep < TOTAL_STEPS) {
    enableStep(currentStep);
  }
  if (currentStep >= TOTAL_STEPS) {
    showSummary();
  }
}

function setStatus(i, msg, isError) {
  const step = steps[i];
  const el = document.getElementById(`status-${step.id}`);
  el.textContent = msg;
  el.style.color = isError ? '#ef4444' : '#888';
}

// ===== WALLET =====
async function connectWallet() {
  try {
    if (!window.ethereum) { alert('No wallet detected — install Rabby or MetaMask'); return; }
    // Force Base network (chainId 8453 = 0x2105)
    try {
      await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x2105' }] });
    } catch(switchErr) {
      if (switchErr.code === 4902) {
        await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: '0x2105', chainName: 'Base', nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 }, rpcUrls: ['https://mainnet.base.org'], blockExplorerUrls: ['https://basescan.org'] }] });
      }
    }
    const provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send('eth_requestAccounts', []);
    signer = await provider.getSigner();
    const addr = await signer.getAddress();
    const net = await provider.getNetwork();
    if (net.chainId !== 8453n) { alert('Please switch to Base network!'); return; }
    document.getElementById('walletStatus').textContent = `Connected: ${addr.slice(0,6)}...${addr.slice(-4)} | Base`;
    document.getElementById('connectBtn').textContent = 'Connected';
    document.getElementById('connectBtn').style.background = '#4ade80';
    enableStep(0);
  } catch(e) {
    document.getElementById('walletStatus').textContent = 'Error: ' + e.message;
  }
}

// ===== DEPLOY HELPER =====
async function deployContract(abi, bin, args, label) {
  const factory = new ethers.ContractFactory(abi, bin, signer);
  const contract = await factory.deploy(...args);
  await contract.waitForDeployment();
  const addr = await contract.getAddress();
  return { contract, addr };
}

// ===== RUN STEP =====
async function runStep(i) {
  const btn = document.getElementById(`btn-${steps[i].id}`);
  btn.disabled = true;
  btn.textContent = 'Deploying...';
  btn.style.opacity = '0.6';
  setStatus(i, 'Sending transaction...');

  try {
    switch(i) {
      case 0: { // PoopToken
        const r = await deployContract(POOP_ABI, POOP_BIN, [], 'PoopToken');
        addresses.poop = r.addr;
        contracts.poop = r.contract;
        setStatus(i, 'Deployed successfully');
        completeStep(i, r.addr);
        break;
      }
      case 1: { // BaselingNFT
        const r = await deployContract(BASELING_ABI, BASELING_BIN, [
          addresses.poop,
          "5000000000000",
          "50000000000000",
          "500000000000000",
          "2500000000000000"
        ], 'BaselingNFT');
        addresses.baseling = r.addr;
        contracts.baseling = r.contract;
        setStatus(i, 'Deployed successfully');
        completeStep(i, r.addr);
        break;
      }
      case 2: { // PlayerPantry (powerPlant = 0x0 placeholder)
        const r = await deployContract(PANTRY_ABI, PANTRY_BIN, [
          addresses.baseling,
          ZERO_ADDR
        ], 'PlayerPantry');
        addresses.pantry = r.addr;
        contracts.pantry = r.contract;
        setStatus(i, 'Deployed (powerPlant=0x0, will set later)');
        completeStep(i, r.addr);
        break;
      }
      case 3: { // PowerPlant
        const r = await deployContract(POWERPLANT_ABI, POWERPLANT_BIN, [
          addresses.poop,
          V2_ROUTER
        ], 'PowerPlant');
        addresses.powerPlant = r.addr;
        contracts.powerPlant = r.contract;
        setStatus(i, 'Deployed successfully');
        completeStep(i, r.addr);
        break;
      }
      case 4: { // GardenNFT
        const r = await deployContract(GARDEN_ABI, GARDEN_BIN, [
          addresses.poop
        ], 'GardenNFT');
        addresses.garden = r.addr;
        contracts.garden = r.contract;
        setStatus(i, 'Deployed successfully');
        completeStep(i, r.addr);
        break;
      }
      case 5: { // CommunityGarden
        const r = await deployContract(COMMUNITY_ABI, COMMUNITY_BIN, [
          addresses.poop
        ], 'CommunityGarden');
        addresses.community = r.addr;
        contracts.community = r.contract;
        setStatus(i, 'Deployed successfully');
        completeStep(i, r.addr);
        break;
      }
      case 6: { // BaselingRouter
        const v4 = document.getElementById('inputV4Swapper').value.trim();
        if (!v4 || !ethers.isAddress(v4)) {
          setStatus(i, 'Enter a valid V4 Swapper address above', true);
          btn.disabled = false; btn.textContent = 'Run'; btn.style.opacity = '1';
          return;
        }
        const r = await deployContract(ROUTER_ABI, ROUTER_BIN, [
          v4, V2_ROUTER, addresses.baseling, addresses.pantry
        ], 'BaselingRouter');
        addresses.router = r.addr;
        contracts.router = r.contract;
        setStatus(i, 'Deployed successfully');
        completeStep(i, r.addr);
        break;
      }
      // ===== CONFIG STEPS =====
      case 7: { // PoopToken.setMinter(baselingNFT, true)
        btn.textContent = 'Configuring...';
        const c = new ethers.Contract(addresses.poop, POOP_ABI, signer);
        const tx = await c.setMinter(addresses.baseling, true);
        await tx.wait();
        setStatus(i, 'Minter granted to BaselingNFT');
        completeStep(i);
        break;
      }
      case 8: { // BaselingNFT.setPowerPlant
        btn.textContent = 'Configuring...';
        const c = new ethers.Contract(addresses.baseling, BASELING_ABI, signer);
        const tx = await c.setPowerPlant(addresses.powerPlant);
        await tx.wait();
        setStatus(i, 'PowerPlant set on BaselingNFT');
        completeStep(i);
        break;
      }
      case 9: { // BaselingNFT.setAuthorized(router)
        btn.textContent = 'Configuring...';
        const c = new ethers.Contract(addresses.baseling, BASELING_ABI, signer);
        const tx = await c.setAuthorized(addresses.router, true);
        await tx.wait();
        setStatus(i, 'Router authorized on BaselingNFT');
        completeStep(i);
        break;
      }
      case 10: { // BaselingNFT.setAuthorized(pantry)
        btn.textContent = 'Configuring...';
        const c = new ethers.Contract(addresses.baseling, BASELING_ABI, signer);
        const tx = await c.setAuthorized(addresses.pantry, true);
        await tx.wait();
        setStatus(i, 'Pantry authorized on BaselingNFT');
        completeStep(i);
        break;
      }
      case 11: { // PlayerPantry.setPowerPlant
        btn.textContent = 'Configuring...';
        const c = new ethers.Contract(addresses.pantry, PANTRY_ABI, signer);
        const tx = await c.setPowerPlant(addresses.powerPlant);
        await tx.wait();
        setStatus(i, 'PowerPlant set on PlayerPantry');
        completeStep(i);
        break;
      }
      case 12: { // PlayerPantry.setAuthorized(router)
        btn.textContent = 'Configuring...';
        const c = new ethers.Contract(addresses.pantry, PANTRY_ABI, signer);
        const tx = await c.setAuthorized(addresses.router, true);
        await tx.wait();
        setStatus(i, 'Router authorized on PlayerPantry');
        completeStep(i);
        break;
      }
      case 13: { // PowerPlant.setAuthorized(baselingNFT)
        btn.textContent = 'Configuring...';
        const c = new ethers.Contract(addresses.powerPlant, POWERPLANT_ABI, signer);
        const tx = await c.setAuthorized(addresses.baseling, true);
        await tx.wait();
        setStatus(i, 'BaselingNFT authorized on PowerPlant');
        completeStep(i);
        break;
      }
      case 14: { // PowerPlant.setAuthorized(pantry)
        btn.textContent = 'Configuring...';
        const c = new ethers.Contract(addresses.powerPlant, POWERPLANT_ABI, signer);
        const tx = await c.setAuthorized(addresses.pantry, true);
        await tx.wait();
        setStatus(i, 'Pantry authorized on PowerPlant');
        completeStep(i);
        break;
      }
      case 15: { // LP Pair Config
        btn.textContent = 'Configuring...';
        const tgn = document.getElementById('inputTgnMftLP').value.trim();
        const burgers = document.getElementById('inputBurgersMftLP').value.trim();
        const azusd = document.getElementById('inputAzusdMftLP').value.trim();
        if (!tgn || !burgers || !azusd || !ethers.isAddress(tgn) || !ethers.isAddress(burgers) || !ethers.isAddress(azusd)) {
          setStatus(i, 'Enter all 3 LP pair addresses in the inputs above', true);
          btn.disabled = false; btn.textContent = 'Run'; btn.style.opacity = '1';
          return;
        }
        const pairsArr = [tgn, burgers, azusd];
        const nft = new ethers.Contract(addresses.baseling, BASELING_ABI, signer);
        const pantry = new ethers.Contract(addresses.pantry, PANTRY_ABI, signer);
        const router = new ethers.Contract(addresses.router, ROUTER_ABI, signer);

        setStatus(i, 'Adding pairs to BaselingNFT...');
        for (const p of pairsArr) {
          const tx = await nft.addPair(p);
          await tx.wait();
        }
        setStatus(i, 'Setting family pairs on BaselingNFT...');
        for (let f = 0; f < 3; f++) {
          const tx = await nft.setFamilyPair(f, pairsArr[f]);
          await tx.wait();
        }
        setStatus(i, 'Setting accepted pairs on PlayerPantry...');
        for (const p of pairsArr) {
          const tx = await pantry.setAcceptedPair(p, true);
          await tx.wait();
        }
        setStatus(i, 'Setting family LP pairs on BaselingRouter...');
        for (let f = 0; f < 3; f++) {
          const tx = await router.setFamilyLPPair(f, pairsArr[f]);
          await tx.wait();
        }
        setStatus(i, 'All LP pairs configured!');
        completeStep(i);
        break;
      }
    }
  } catch(e) {
    console.error(e);
    setStatus(i, 'Error: ' + (e.reason || e.message || e), true);
    btn.disabled = false;
    btn.textContent = 'Retry';
    btn.style.opacity = '1';
  }
}

// ===== SUMMARY =====
function showSummary() {
  document.getElementById('summarySection').style.display = 'block';
  const html = Object.entries({
    'PoopToken': addresses.poop,
    'BaselingNFT': addresses.baseling,
    'PlayerPantry': addresses.pantry,
    'PowerPlant': addresses.powerPlant,
    'GardenNFT': addresses.garden,
    'CommunityGarden': addresses.community,
    'BaselingRouter': addresses.router,
  }).map(([k,v]) => `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #333;"><span style="color:#888;">${k}</span><span style="color:#f0d070;user-select:all;">${v}</span></div>`).join('');
  document.getElementById('summaryAddresses').innerHTML = html;

  const block = `// Baseling V2 Deployed Addresses
POOP_TOKEN = "${addresses.poop}"
BASELING_NFT = "${addresses.baseling}"
PLAYER_PANTRY = "${addresses.pantry}"
POWER_PLANT = "${addresses.powerPlant}"
GARDEN_NFT = "${addresses.garden}"
COMMUNITY_GARDEN = "${addresses.community}"
BASELING_ROUTER = "${addresses.router}"
V2_ROUTER = "${V2_ROUTER}"`;
  document.getElementById('copyBlock').textContent = block;
}

function copySummary() {
  const text = document.getElementById('copyBlock').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy All Addresses', 2000);
  });
}
